; Ajustes do Clinic sobre o php.ini-production.
expose_php = Off
date.timezone = UTC

; Uploads: até 5 fotos de 8 MB por envio, documento PDF de até 10 MB.
; O nginx aceita até 50 MB (client_max_body_size).
upload_max_filesize = 10M
post_max_size = 48M
max_file_uploads = 20

; O PhotoProcessor sobe este limite sozinho para fotos grandes (até 50 megapixels).
memory_limit = 256M
max_execution_time = 60

; Rastros de erro sem argumentos de função: não levam dados de paciente ao log.
zend.exception_ignore_args = On
display_errors = Off
log_errors = On

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; O código não muda dentro do container: não confere arquivos a cada requisição.
opcache.validate_timestamps = 0

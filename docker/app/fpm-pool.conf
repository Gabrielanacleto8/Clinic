[www]
; Só o nginx da rede interna do docker-compose alcança esta porta.
listen = 9000
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
; O .env não entra na imagem: a configuração vem das variáveis do container.
clear_env = no

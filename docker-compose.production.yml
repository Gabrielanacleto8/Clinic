# Produção do Clinic num servidor só (VPS). Passo a passo em docs/deploy.md.
#
#   docker compose -f docker-compose.production.yml build
#   docker compose -f docker-compose.production.yml up -d
#
# As variáveis vêm do .env ao lado deste arquivo (nunca versionado).
name: clinic

x-app: &app
  image: clinic-app:${CLINIC_VERSION:-latest}
  restart: unless-stopped
  env_file: .env
  environment:
    APP_ENV: production
    # O .env inteiro entra pelo env_file: o que a aplicação não usa é apagado aqui.
    DB_ROOT_PASSWORD: ""
    BACKUP_PASSPHRASE: ""
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: "3306"
    PATIENT_PHOTOS_PATH: /var/clinic/patient-files
  volumes:
    - patient-files:/var/clinic/patient-files
    - app-logs:/var/www/html/storage/logs
  depends_on:
    mysql:
      condition: service_healthy

services:
  app:
    <<: *app
    build:
      context: .
      target: app

  # Tarefas periódicas do Laravel (routes/console.php).
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]

  web:
    image: clinic-web:${CLINIC_VERSION:-latest}
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      CLINIC_DOMAIN: ${CLINIC_DOMAIN:?defina CLINIC_DOMAIN no .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ${CERTBOT_WEBROOT:-./certbot-www}:/var/www/certbot:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?defina DB_DATABASE no .env}
      MYSQL_USER: ${DB_USERNAME:?defina DB_USERNAME no .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina DB_ROOT_PASSWORD no .env}
    # Sem porta publicada: o banco só é alcançado pela rede interna.
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Backup diário do banco e das fotos (docker/backup). Usa a imagem do MySQL
  # para ter o mysqldump da mesma versão do servidor.
  backup:
    image: mysql:8.4
    restart: unless-stopped
    entrypoint: ["/opt/clinic-backup/run.sh"]
    environment:
      TZ: ${CLINIC_TIMEZONE:-America/Sao_Paulo}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_ALLOW_PLAINTEXT: ${BACKUP_ALLOW_PLAINTEXT:-0}
      BACKUP_DIR: /backups
      FILES_DIR: /patient-files
    volumes:
      - ./docker/backup:/opt/clinic-backup:ro
      - patient-files:/patient-files:ro
      - ${BACKUP_PATH:-./backups}:/backups
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  patient-files:
  app-logs:
